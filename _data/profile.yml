bio: >
  Hello! Welcome to my page. I'm Renato La Torre, a Ph.D. student in the Integrative
  Biology program at University of California, Berkeley. I am passionate in
  characterizing biodiversity through space and time, and understanding the processes
  behind the shaping of their genomes. I have expertise in the application of novel
  molecular techniques such as environmental and ancient DNA. By looking into species'
  past, I aim to contribute to their conservation in the future. Feel free to explore
  my page to learn more about my work. Please, do not hesitate to reach out to me 😀
